<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Apex Vanguard 3D - Dual Stick Combat</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 12px 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .hud-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .hud-value {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }
    .health-bar-container {
      width: 200px;
      height: 16px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(239, 68, 68, 0.4);
      margin-top: 4px;
    }
    .health-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f87171);
      transition: width 0.2s ease;
    }
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      color: #cbd5e1;
      backdrop-filter: blur(6px);
      pointer-events: none;
      text-align: center;
    }
    /* Mobile Touch Joysticks Overlay */
    #touch-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 30px;
    }
    .joystick-zone {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    .joystick-knob {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, #0284c7);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      pointer-events: none;
      transform: translate(0px, 0px);
    }
    .joystick-label {
      position: absolute;
      top: -25px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    #fire-button {
      position: absolute;
      bottom: 180px;
      right: 40px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444, #dc2626);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      touch-action: none;
    }
    #game-over-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(12px);
    }
    #game-over-modal.hidden {
      display: none;
    }
    .modal-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 16px;
      padding: 30px 40px;
      text-align: center;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .modal-card h1 {
      margin-top: 0;
      color: #ef4444;
      font-size: 32px;
    }
    .restart-btn {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #0f172a;
      background: #38bdf8;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    .restart-btn:hover {
      background: #7dd3fc;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-overlay">
    <div class="hud-header">
      <div class="hud-box">
        <div class="hud-title">Health</div>
        <div class="health-bar-container">
          <div id="health-bar" class="health-bar-fill"></div>
        </div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div class="hud-title">Score</div>
        <div id="score-display" class="hud-value">0</div>
      </div>
    </div>
    <div id="controls-hint">
      Desktop: WASD / Arrows to Move | Mouse to Aim & Click to Fire<br/>
      Mobile: Left Stick = Move | Right Stick = Aim & Auto/Button Fire
    </div>
  </div>

  <div id="touch-controls">
    <div id="move-joystick-zone" class="joystick-zone">
      <div class="joystick-label">MOVE</div>
      <div id="move-joystick-knob" class="joystick-knob"></div>
    </div>

    <div id="fire-button">FIRE</div>

    <div id="aim-joystick-zone" class="joystick-zone">
      <div class="joystick-label">AIM</div>
      <div id="aim-joystick-knob" class="joystick-knob"></div>
    </div>
  </div>

  <div id="game-over-modal" class="hidden">
    <div class="modal-card">
      <h1 id="modal-title">GAME OVER</h1>
      <p id="final-score-text" style="color: #cbd5e1; font-size: 18px;">Final Score: 0</p>
      <button id="restart-button" class="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
